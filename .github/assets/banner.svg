<svg width="1200" height="320" viewBox="0 0 1200 320" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="SMRITI VoiceBot — the voice on the other end, in their own language">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F9F4ED"/>
      <stop offset="55%" stop-color="#F5EAD8"/>
      <stop offset="100%" stop-color="#F0DFC6"/>
    </linearGradient>
    <linearGradient id="badge" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E8A83F"/>
      <stop offset="100%" stop-color="#BC5A3C"/>
    </linearGradient>
    <pattern id="dots" width="26" height="14" patternUnits="userSpaceOnUse">
      <animateTransform attributeName="patternTransform" type="translate" from="0 0" to="26 0" dur="1.8s" repeatCount="indefinite"/>
      <path d="M6.5,1.5 L11.5,7 L6.5,12.5 L1.5,7 Z" fill="#BC5A3C"/>
      <path d="M20.5,3 L23.5,7 L20.5,11 L17.5,7 Z" fill="#E8A83F"/>
    </pattern>
  </defs>

  <!-- dotted-diamond border, top and bottom -->
  <rect x="0" y="0" width="1200" height="14" fill="url(#dots)"/>
  <rect x="0" y="306" width="1200" height="14" fill="url(#dots)"/>

  <rect x="0" y="14" width="1200" height="292" fill="url(#bg)"/>
  <path d="M0,260 Q150,225 320,245 T650,235 T1000,250 T1200,240 L1200,306 L0,306 Z" fill="#EBDDC5" opacity="0.6"/>

  <!-- logomark: pulsing "listening" badge -->
  <g transform="translate(80,90)">
    <circle cx="70" cy="70" r="70" fill="none" stroke="#E8A83F" stroke-width="2" opacity="0">
      <animate attributeName="r" values="72;108" dur="2.6s" begin="0s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.55;0" dur="2.6s" begin="0s" repeatCount="indefinite"/>
    </circle>
    <circle cx="70" cy="70" r="70" fill="none" stroke="#56633F" stroke-width="2" opacity="0">
      <animate attributeName="r" values="72;108" dur="2.6s" begin="1.3s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.45;0" dur="2.6s" begin="1.3s" repeatCount="indefinite"/>
    </circle>

    <rect x="0" y="0" width="140" height="140" rx="34" fill="url(#badge)"/>

    <g transform="translate(38,52)" fill="#FFF8EE">
      <rect x="0"  y="14" width="9" height="8"  rx="4.5"><animate attributeName="height" values="8;30;10;24;8" keyTimes="0;0.25;0.5;0.75;1" dur="1.5s" begin="0s" repeatCount="indefinite"/><animate attributeName="y" values="14;3;13;6;14" keyTimes="0;0.25;0.5;0.75;1" dur="1.5s" begin="0s" repeatCount="indefinite"/></rect>
      <rect x="15" y="8"  width="9" height="20" rx="4.5"><animate attributeName="height" values="20;6;30;12;20" keyTimes="0;0.25;0.5;0.75;1" dur="1.3s" begin="0.15s" repeatCount="indefinite"/><animate attributeName="y" values="8;15;2;11;8" keyTimes="0;0.25;0.5;0.75;1" dur="1.3s" begin="0.15s" repeatCount="indefinite"/></rect>
      <rect x="30" y="0"  width="9" height="36" rx="4.5"><animate attributeName="height" values="36;14;28;8;36" keyTimes="0;0.25;0.5;0.75;1" dur="1.7s" begin="0.3s" repeatCount="indefinite"/><animate attributeName="y" values="0;11;4;14;0" keyTimes="0;0.25;0.5;0.75;1" dur="1.7s" begin="0.3s" repeatCount="indefinite"/></rect>
      <rect x="45" y="10" width="9" height="16" rx="4.5"><animate attributeName="height" values="16;32;10;26;16" keyTimes="0;0.25;0.5;0.75;1" dur="1.4s" begin="0.45s" repeatCount="indefinite"/><animate attributeName="y" values="10;2;15;5;10" keyTimes="0;0.25;0.5;0.75;1" dur="1.4s" begin="0.45s" repeatCount="indefinite"/></rect>
      <rect x="60" y="16" width="9" height="4"  rx="4.5"><animate attributeName="height" values="4;24;8;18;4" keyTimes="0;0.25;0.5;0.75;1" dur="1.6s" begin="0.6s" repeatCount="indefinite"/><animate attributeName="y" values="16;6;14;9;16" keyTimes="0;0.25;0.5;0.75;1" dur="1.6s" begin="0.6s" repeatCount="indefinite"/></rect>
    </g>
  </g>

  <!-- wordmark -->
  <text x="252" y="118" font-family="Segoe UI, Helvetica, sans-serif" font-size="14" font-weight="700" letter-spacing="3" fill="#8C491A">SMRITI · SIH26003YELLOW</text>
  <text x="248" y="172" font-family="Segoe UI, Helvetica, sans-serif" font-size="58" font-weight="700" fill="#201E1D">VoiceBot</text>
  <text x="252" y="206" font-family="Segoe UI, Helvetica, sans-serif" font-size="21" fill="#645C50">the voice on the other end, in their own language</text>
  <text x="252" y="238" font-family="Noto Serif, Georgia, serif" font-size="17" fill="#8C491A">स्मृति · স্মৃতি · memory</text>

  <text x="252" y="272" font-family="Segoe UI, Helvetica, sans-serif" font-size="14" fill="#645C50">FastAPI · Groq · Sarvam · Indic Parler-TTS · deployed on AWS EC2</text>
</svg>
