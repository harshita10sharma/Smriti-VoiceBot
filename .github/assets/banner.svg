<svg width="1200" height="280" viewBox="0 0 1200 280" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="SMRITI VoiceBot — the voice on the other end, in their own language">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F9F4ED"/>
      <stop offset="55%" stop-color="#F5EAD8"/>
      <stop offset="100%" stop-color="#F0DFC6"/>
    </linearGradient>
    <linearGradient id="bar" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#BC5A3C"/>
      <stop offset="100%" stop-color="#E8A83F"/>
    </linearGradient>
    <linearGradient id="bar-alt" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#56633F"/>
      <stop offset="100%" stop-color="#8FA073"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="280" fill="url(#bg)"/>

  <!-- distant hill line, matching the sibling SMRITI web app's terracotta/sage palette -->
  <path d="M0,240 Q150,205 320,225 T650,215 T1000,230 T1200,220 L1200,280 L0,280 Z" fill="#EBDDC5" opacity="0.6"/>

  <text x="60" y="108" font-family="Segoe UI, Helvetica, sans-serif" font-size="54" font-weight="700" fill="#201E1D">🎙 SMRITI VoiceBot</text>
  <text x="62" y="145" font-family="Segoe UI, Helvetica, sans-serif" font-size="21" fill="#645C50">the voice on the other end, in their own language</text>

  <!-- animated listening waveform -->
  <g transform="translate(62,175)">
    <!-- 36 bars, alternating gradient, staggered SMIL animation so it reads as a live waveform -->
    <rect x="0"   y="30" width="10" height="10" rx="5" fill="url(#bar)"><animate attributeName="height" values="10;46;14;38;10" keyTimes="0;0.25;0.5;0.75;1" dur="1.6s" begin="0s" repeatCount="indefinite"/><animate attributeName="y" values="30;12;28;16;30" keyTimes="0;0.25;0.5;0.75;1" dur="1.6s" begin="0s" repeatCount="indefinite"/></rect>
    <rect x="16"  y="24" width="10" height="22" rx="5" fill="url(#bar-alt)"><animate attributeName="height" values="22;50;18;44;22" keyTimes="0;0.25;0.5;0.75;1" dur="1.4s" begin="0.08s" repeatCount="indefinite"/><animate attributeName="y" values="24;10;26;13;24" keyTimes="0;0.25;0.5;0.75;1" dur="1.4s" begin="0.08s" repeatCount="indefinite"/></rect>
    <rect x="32"  y="16" width="10" height="38" rx="5" fill="url(#bar)"><animate attributeName="height" values="38;12;46;20;38" keyTimes="0;0.25;0.5;0.75;1" dur="1.8s" begin="0.16s" repeatCount="indefinite"/><animate attributeName="y" values="16;34;12;30;16" keyTimes="0;0.25;0.5;0.75;1" dur="1.8s" begin="0.16s" repeatCount="indefinite"/></rect>
    <rect x="48"  y="8"  width="10" height="54" rx="5" fill="url(#bar-alt)"><animate attributeName="height" values="54;20;42;14;54" keyTimes="0;0.25;0.5;0.75;1" dur="1.5s" begin="0.24s" repeatCount="indefinite"/><animate attributeName="y" values="8;30;18;36;8" keyTimes="0;0.25;0.5;0.75;1" dur="1.5s" begin="0.24s" repeatCount="indefinite"/></rect>
    <rect x="64"  y="20" width="10" height="30" rx="5" fill="url(#bar)"><animate attributeName="height" values="30;48;16;40;30" keyTimes="0;0.25;0.5;0.75;1" dur="1.7s" begin="0.32s" repeatCount="indefinite"/><animate attributeName="y" values="20;11;33;19;20" keyTimes="0;0.25;0.5;0.75;1" dur="1.7s" begin="0.32s" repeatCount="indefinite"/></rect>
    <rect x="80"  y="26" width="10" height="18" rx="5" fill="url(#bar-alt)"><animate attributeName="height" values="18;44;12;36;18" keyTimes="0;0.25;0.5;0.75;1" dur="1.3s" begin="0.4s" repeatCount="indefinite"/><animate attributeName="y" values="26;14;32;18;26" keyTimes="0;0.25;0.5;0.75;1" dur="1.3s" begin="0.4s" repeatCount="indefinite"/></rect>
    <rect x="96"  y="14" width="10" height="42" rx="5" fill="url(#bar)"><animate attributeName="height" values="42;16;50;24;42" keyTimes="0;0.25;0.5;0.75;1" dur="1.9s" begin="0.48s" repeatCount="indefinite"/><animate attributeName="y" values="14;32;10;28;14" keyTimes="0;0.25;0.5;0.75;1" dur="1.9s" begin="0.48s" repeatCount="indefinite"/></rect>
    <rect x="112" y="22" width="10" height="26" rx="5" fill="url(#bar-alt)"><animate attributeName="height" values="26;50;14;40;26" keyTimes="0;0.25;0.5;0.75;1" dur="1.6s" begin="0.56s" repeatCount="indefinite"/><animate attributeName="y" values="22;10;33;15;22" keyTimes="0;0.25;0.5;0.75;1" dur="1.6s" begin="0.56s" repeatCount="indefinite"/></rect>
  </g>

  <text x="62" y="264" font-family="Segoe UI, Helvetica, sans-serif" font-size="15" fill="#8C491A">FastAPI · Groq · Sarvam · Indic Parler-TTS · deployed on AWS</text>
</svg>
